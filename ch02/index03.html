<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch02 - index03.html</h1>

    <script>
      console.log("1.----- 산술 연산자 -----");
      let a = 10;
      let b = 3;
      console.log(a + b); // 13
      console.log(a - b); // 7
      console.log(a * b); // 30
      console.log(a / b); // 3.33333
      console.log(a & b); // 1

      console.log("2.----- 할당 연산자 -----");
      let point = 100;
      point += 50;
      console.log(point);

      point -= 30;
      console.log(point);

      point++; // 1 증가
      console.log(point);

      point--; // 1 감소
      console.log(point);

      console.log("3.----- 비교 연산자 -----");
      console.log(10 > 5); // true
      console.log(10 <= 5); // false

      console.log(10 == "10"); // true
      console.log(10 === "10"); // false

      // 부정형도 마찬가지
      console.log(10 != "10"); // false
      console.log(10 !== "10"); // true

      console.log("4.----- 논리 연산자 -----");
      console.log(true && false); // false(둘 다 참이어야 참)
      console.log(true || false); // true(하나만 참이면 참)
      console.log(!false); // true(뒤집기)

      console.log("5.----- 연산자 우선순위 -----");
      // 곱하기 / 나누기가 더하기 빼기보다 먼저 계산된다.
      console.log(2 + 3 * 4); // 14
      // 헷갈리면 소괄호로 묶는다.
      console.log((2 + 3) * 4); // 20
    </script>
  </body>
</html>
