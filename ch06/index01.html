<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch06 - index01.html</h1>
    <script>
      console.log("----- 1. 메서드로 호출하면 this는 점 앞에 객체이다. -----");
      const cat = {
        name: "나비",
        // name2: "나비2",
        introduce: function () {
          console.log("제 이름은 " + this.name + " 입니다.");
          // console.log("제 이름은 " + this.name2 + " 입니다.");
          // name2를 사용하면 밑에 초코, alone은 undefined가 나옴
        },
      };
      cat.introduce(); // 점 앞에 있는 cat이 this이다.

      console.log("----- 2. 같은 함수를 다른 객체에 붙이면 this도 바뀐다. -----");
      const dog = {
        name: "초코",
        introduce: cat.introduce,
      };
      dog.introduce(); // 제 이름은 초코입니다. 여기서 this는?
      // 점 앞에 있는 dog의 this

      console.log("----- 3. 그냥 호출하면 this는 window 객체이다. -----");
      const alone = cat.introduce; // 함수 호출이 아닌 변수에 할당
      alone(); // 실제 함수의 동작은 cat의 this.name이라서 this가 window를 가리킴
      // 주의! window.name 속성은 특수한 변수라서 미리 선점되어 있다.

      console.log("----- 4. new로 호출하면 this는 새로 만들어지는 객체를 가리킨다. -----");
      function Member(name) {
        this.name = name;
      }
      const member1 = new Member("홍길동");
      console.log(member1.name);

      // 만약 new 키워드를 사용 안하고 호출한다면
      const member2 = Member("이순신");
      console.log(member2);
      console.log(typeof member2);
      console.log(window.name);
      // new를 사용하지 않으면 점이 없는 호출이 된다.
      // 즉 this는 window가 되어 실제 가지고 있는 멤버변수 name에 방금 넣은 인수값 이순신이 담기는 구조가 된다.

      window.name = ""; // 새로고침을 해도 값이 남는 특수한 속성이 있다. 다른 코드에 영향을 줄 수 있기 때문에 초기화 처리한다.
    </script>
  </body>
</html>
