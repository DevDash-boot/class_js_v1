<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch06 - index02.html</h1>
    <script>
      console.log("--- 1. this 버그 ---");
      const timer = {
        seconds: 3,
        label: "요리 타이머",
        start: function () {
          console.log(this.label + " 시작 " + this.seconds + "초");

          setTimeout(function () {
            console.log(this.label + " : 요리 끝");
          }, 3000);
        },
      };
      // 이 메서드 안의 콜백 함수에서 사용하고 있는 this는 window를 가리킨다.
      timer.start();

      console.log("--- 2. forEach에서도 같은 일이 발생한다. ---");
      const shop = {
        name: "코딩상점",
        products: ["마우스", "키보드", "모니터"],
        printAll: function () {
          // 이 this는 shop을 가리킨다.
          console.log(this.name);
          this.products.forEach(function (product) {
            console.log(this.name + " - " + product);
            // 이 시점에 this는 window를 가리킨다.
            // console.log에서는 this.name이 빈 문자를 출력한다.
          });
        },
      };
      shop.printAll();

      console.log("--- 3. 옛날 방식의 해결 : this를 다른 변수에 담아두기 ---");
      const shop2 = {
        name2: "코딩상점",
        products: ["마우스", "키보드", "모니터"],
        printAll: function () {
          const self = this; // 메서드 안에서 this가 shop2일 때 변수에 담아둔다.
          this.products.forEach(function (product) {
            console.log(self.name2 + " - " + product); // this -> self
          });
        },
      };
      shop2.printAll();
    </script>
  </body>
</html>
