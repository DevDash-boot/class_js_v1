<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch07 - index04.html</h1>
    <script>
      let stock = 0;
      console.log(stock || "재고 없음");

      // null 병합 연산자(??) : null과 undefined일 때만 오른쪽 값을 사용한다.
      console.log(0 ?? "재고없음"); // 0
      // 0은 null도 아니고 undefined도 아니므로 그대로 0이 된다.

      console.log(null ?? 0); // 0
      console.log("" || "댓글없음"); // 댓글없음
      console.log("" ?? "댓글없음"); // 빈 칸
      console.log(false || true); // true
      console.log(false ?? true); // false

      // 진짜 없을 때 ?? 오른쪽 기본 값으로 설정한다.
    </script>
  </body>
</html>
