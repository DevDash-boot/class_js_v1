    </style>

  <body>
    <h1>ch08 - index04.html</h1>
    <div id="product-list"></div>
    <script>
      console.log("--- 1. id로 하나 찾기 ---");
      const products = [
        { id: 1, name: "무선 마우스", price: 25000, stock: 3 },
        { id: 2, name: "기계식 키보드", price: 89000, stock: 0 },
        { id: 3, name: "모니터 받침대", price: 15000, stock: 12 },
      ];
      const found = products.find((p) => p.id === 2);
      console.log(found);

      console.log("--- 2. 찾는 요소가 없다면 undefined 반환 ---");
      const found2 = products.find((p) => p.id === 5);
      console.log(found2); // undefined

      const selectedName = found2?.name ?? "해당 상품이 없습니다.";
      document.getElementById("product-list").textContent = selectedName;
    </script>
  </body>
</html>
