<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #parent {
        padding: 50px;
        background-color: aquamarine;
        border: 3px solid black;
        text-align: center;
      }
      #child {
        background-color: bisque;
        padding: 15px 30px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>ch13 - index01.html</h1>
    <div id="parent">
      이곳은 넓은 부모 영역입니다.
      <br />
      <button id="child">자식 버튼</button>
    </div>
    <script>
      const parent = document.getElementById("parent");

      // 부모 영역 하나에만 리스너를 등록한다.
      parent.addEventListener("click", (e) => {
        console.log("이벤트 종류 : ", e.type); // click
        console.log("실제 클릭된 요소 : ", e.target.id); // child
        console.log("리스너가 달린 요소 : ", e.currentTarget.id); // parent
      });
    </script>
  </body>
</html>
