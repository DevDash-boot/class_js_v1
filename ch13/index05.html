<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        padding: 20px;
      }
      ul {
        list-style: none;
        margin-top: 20px;
        width: 300px;
      }
      li {
        background-color: rgb(158, 208, 252);
        border: 1px solid black;
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      button {
        padding: 5px 10px;
      }
      .btnStyle {
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <h1>ch13 - index05.html</h1>
    <button id="btnAdd">새 아이템 추가</button>
    <ul id="itemList">
      <li>
        <p>기존 아이템 1</p>
        <button class="done-btn">완료</button>
        <button class="delete-btn">삭제</button>
      </li>
      <li>
        <p>기존 아이템 2</p>
        <button class="done-btn">완료</button>
        <button class="delete-btn">삭제</button>
      </li>
      <li>
        <p>기존 아이템 3</p>
        <button class="done-btn">완료</button>
        <button class="delete-btn">삭제</button>
      </li>
    </ul>
    <script>
      // 페이지가 로드된 시점에는 존재하는 버튼이 현재 3개(NodeList)
      const deleteBtnList = document.querySelectorAll(".delete-btn");
      const btnAddEl = document.querySelector("#btnAdd");
      const itemListEl = document.querySelector("#itemList");

      // 중요!
      // 1. 이벤트 위임 : 부모 요소 하나에만 리스너를 등록한다.(ul)
      itemListEl.addEventListener("click", (e) => {
        const li = e.target.closest("li");
        // 클릭된 요소가 삭제 버튼일 때만 동작한다.
        if (e.target.classList.contains("delete-btn")) {
          const isOk = confirm("정말 삭제하시겠습니까?");
          if (isOk) {
            li.remove();
          }
        } else if (e.target.classList.contains("done-btn")) {
          li.querySelector("p").classList.toggle("btnStyle");
        }
      });
      btnAddEl.addEventListener("click", () => {
        const currentCount = itemListEl.children.length;

        const newItem = document.createElement("li");
        newItem.innerHTML = `<p>기존 아이템 ${currentCount + 1}</p> <button class="done-btn">완료</button> 
        <button class="delete-btn">삭제</button>`;
        itemListEl.append(newItem);
      });
    </script>
  </body>
</html>
