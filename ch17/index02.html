<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch17 - index02.html</h1>
    <p>
      Promise 객체 생성 즉시 대기 상태가 됨. 작업이 끝나면 이행 또는 거부로
      바뀐다.
    </p>
    <button id="startBtn">주문</button>
    <script>
      // 함수 선언문 - 주문을 받아서 Promise를 돌려준다.
      function orderCoffee(order) {
        // 코드 작성 ~
        return new Promise((resolve, rejected) => {
          // 이 안에는 시간이 걸리는 작업을 적는다. 여기서는 3초 타이머로 흉내만 냄
          setTimeout(() => {
            // 3초 뒤 응답이 오면 해야할 일을 설계하는 부분
            if (order === "아메리카노" || order === "라떼") {
              resolve(order + "가 나왔습니다."); // 성공 : 이행 상태로 바꾸고 값을 전달
            } else {
              rejected(order + "은/는 판매하지 않습니다."); // 실패 : 거부 상태로 바꾸고 이유 전달
            }
          }, 3000);
        });
      }
      document.getElementById("startBtn").addEventListener("click", () => {
        const orderPromise = orderCoffee("주스");
        console.log("콘솔에서 상태 확인 : ", orderPromise);
        // 클릭 직후 : pending 상태
        // 3초 후 : rejected로 응답을 받았다.
      });
    </script>
  </body>
</html>
