<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch18 - index01.html</h1>
    <script>
      // 샘플 데이터
      const todo = { userId: 1, id: 100, title: "오늘 복습", completed: false };

      // 객체 --> JSON 문자열(서버로 보낼 때)
      const jsonText = JSON.stringify(todo);
      console.log(jsonText);

      // JSON 문자열 --> 객체(서버에서 받았을 때)
      const ParsedTodo = JSON.parse(jsonText);
      console.log(ParsedTodo);
      // JSON은 .연산자를 사용할 수 있다.
      console.log(ParsedTodo.id);
      console.log(ParsedTodo.title);

      // 오류 확인
      try {
        const BadTodo = JSON.parse("fsd : dasf");
      } catch (error) {
        console.log("잘못된 JSON 형식입니다.");
      }
    </script>
  </body>
</html>
