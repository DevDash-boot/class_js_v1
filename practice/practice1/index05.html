  <body>
    <h1>9/22 ~ 9/23 연습</h1>
    <h2>find + 옵셔널 체이닝 + nullish coalescing</h2>
    <script>
      const users = [
        { id: 1, name: "김철수" },
        { id: 2, name: "이영희" },
        { id: 3, name: "박민수" },
      ];

      const find = users.find((u) => u.id === 10);
      console.log(`회원이름 : ${find?.name ?? "회원을 찾을 수 없습니다."}`);
    </script>
  </body>
