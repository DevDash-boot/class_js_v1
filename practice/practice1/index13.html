<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .highlight {
        background-color: yellow;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>9/22 ~ 9/23 연습</h1>
    <h2>classList</h2>
    <p id="message">강조할 문장입니다.</p>
    <script>
      const id = document.getElementById("message");
      id.classList.add("highlight");
    </script>
  </body>
</html>
