<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 이벤트 처리 연습 -->
    <title>Todo App</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        padding: 50px;
        background: #f5f5f5;
      }

      .container {
        width: 500px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 15px;
      }

      h1 {
        text-align: center;
      }

      .banner {
        padding: 20px;
        margin: 20px 0;
        background: #eee;
        text-align: center;
        border-radius: 10px;
      }

      .banner.active {
        animation: fade 0.5s;
      }

      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      form {
        display: flex;
        gap: 10px;
      }

      input {
        flex: 1;
        padding: 10px;
      }

      button {
        cursor: pointer;
        padding: 8px 12px;
      }

      ul {
        padding: 0;
        list-style: none;
      }

      li {
        display: flex;
        justify-content: space-between;
        padding: 12px;
        margin-top: 8px;
        background: #f0f0f0;
        border-radius: 8px;
      }

      li.done {
        text-decoration: line-through;
        opacity: 0.5;
      }

      .count {
        text-align: right;
        margin-top: 15px;
        color: #666;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>오늘의 할 일</h1>

      <div class="banner">
        <span id="bannerText">오늘도 힘내세요!</span>
      </div>

      <form id="todoForm">
        <input type="text" id="todoInput" placeholder="할 일을 입력하세요" />
        <button type="submit">추가</button>
      </form>

      <ul id="todoList">
        <li>
          <span>JavaScript 공부</span>
          <button class="delete">삭제</button>
        </li>

        <li>
          <span>운동하기</span>
          <button class="delete">삭제</button>
        </li>
      </ul>

      <div class="count"><span id="count">2</span>개의 할 일</div>
    </div>

    <script>
      const todoForm = document.querySelector("#todoForm");
      const todoInput = document.querySelector("#todoInput");
      const todoList = document.querySelector("#todoList");
      const count = document.querySelector("#count");
      const banner = document.querySelector(".banner");
      const bannerText = document.querySelector("#bannerText");

      // 할 일 추가하기
      todoForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const todoText = todoInput.value.trim();
        if (todoText === "") return;
        const newItem = document.createElement("li");
        newItem.innerHTML = `<span>${todoText}</span><button class="delete">삭제</button>`;
        todoList.append(newItem);
        todoInput.value = "";
        count.textContent = todoList.children.length;
      });

      // 할 일 삭제 + 완료 처리
      todoList.addEventListener("click", (e) => {
        const li = e.target.closest("li");
        if (e.target.classList.contains("delete")) {
          li.remove();
        } else {
          li.classList.toggle("done");
        }
        count.textContent = todoList.children.length;
      });

      // 배너 변경
      const messages = [
        "오늘도 힘내세요!",
        "조금씩 꾸준히 해봅시다!",
        "JavaScript 공부 중!",
        "오늘의 목표를 달성해봅시다!",
      ];
      let index = 0;

      setInterval(() => {
        index++;
        if (index >= messages.length) index = 0;
        bannerText.textContent = messages[index];
        banner.classList.remove("active");
        setTimeout(() => {
          banner.classList.add("active");
        }, 10);
      }, 3000);
    </script>
  </body>
</html>
