<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Promise, async, await 연습 1</h1>
    <input type="text" value="배송중" style="padding: 4px" id="deliveryInput" />
    <button id="button">배송 상태 확인</button>
    <p
      id="noticeBoard"
      style="padding: 50px; border: 1px solid #ccc; text-align: center"
    >
      배송 상태 확인
    </p>
    <script>
      const button = document.getElementById("button");
      const deliveryInput = document.getElementById("deliveryInput");
      const noticeBoard = document.getElementById("noticeBoard");

      function checkDelivery(delivery) {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            if (delivery === "배송중" || delivery === "배송완료") {
              resolve("배송상태 : " + delivery); // 성공 : 이행 상태로 바꾸고 값을 전달
            } else {
              reject("해당 배송 상태를 확인할 수 없습니다."); // 실패 : 거부 상태로 바꾸고 이유 전달
            }
          }, 3000);
        });
      }
      // await를 사용하려면 그 코드를 감싸는 함수에 반드시 async를 붙여야 한다.
      button.addEventListener("click", async () => {
        try {
          const result = await checkDelivery(deliveryInput.value);
          noticeBoard.textContent = result;
        } catch (error) {
          noticeBoard.textContent = error;
        }
      });
    </script>
  </body>
</html>
