<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Promise, async, await 연습 2</h1>
    <input type="text" value="admin" style="padding: 4px" id="loginInput" />
    <button id="button">로그인</button>
    <p
      id="noticeBoard"
      style="padding: 50px; border: 1px solid #ccc; text-align: center"
    >
      로그인 확인
    </p>
    <script>
      const button = document.getElementById("button");
      const loginInput = document.getElementById("loginInput");
      const noticeBoard = document.getElementById("noticeBoard");

      function checkLogin(login) {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            if (login === "admin") {
              resolve("로그인 성공!"); // 성공 : 이행 상태로 바꾸고 값을 전달
            } else {
              reject("존재하지 않는 아이디입니다."); // 실패 : 거부 상태로 바꾸고 이유 전달
            }
          }, 3000);
        });
      }
      // await를 사용하려면 그 코드를 감싸는 함수에 반드시 async를 붙여야 한다.
      button.addEventListener("click", async () => {
        try {
          const result = await checkLogin(loginInput.value);
          noticeBoard.textContent = result;
        } catch (error) {
          noticeBoard.textContent = error;
        }
      });
    </script>
  </body>
</html>
