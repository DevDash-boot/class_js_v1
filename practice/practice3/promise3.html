<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Promise, async, await 연습 3</h1>
    <input type="text" value="admin" style="padding: 4px" id="orderInput" />
    <button id="button">주문하기</button>
    <p
      id="noticeBoard"
      style="padding: 50px; border: 1px solid #ccc; text-align: center"
    >
      판매 음식 : 피자, 치킨, 햄버거
    </p>
    <script>
      const button = document.getElementById("button");
      const orderInput = document.getElementById("orderInput");
      const noticeBoard = document.getElementById("noticeBoard");

      function checkOrder(order) {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            if (order === "피자" || order === "치킨" || order === "햄버거") {
              resolve(order + " 주문이 완료되었습니다."); // 성공 : 이행 상태로 바꾸고 값을 전달
            } else {
              reject(order + "는 현재 판매하지 않습니다."); // 실패 : 거부 상태로 바꾸고 이유 전달
            }
          }, 3000);
        });
      }
      // await를 사용하려면 그 코드를 감싸는 함수에 반드시 async를 붙여야 한다.
      button.addEventListener("click", async () => {
        try {
          const result = await checkOrder(orderInput.value);
          noticeBoard.textContent = result;
        } catch (error) {
          noticeBoard.textContent = error;
        }
      });
    </script>
  </body>
</html>
