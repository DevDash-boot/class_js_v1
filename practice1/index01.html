<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>9/22 ~ 9/23 연습</h1>
    <h2>배열 + forEach</h2>
    <script>
      const students = [
        { name: "김철수", score: 85 },
        { name: "이영희", score: 92 },
        { name: "박민수", score: 76 },
      ];
      students.forEach((p) => {
        console.log(`${p.name} : ${p.score}점`);
      });
    </script>
  </body>
</html>
