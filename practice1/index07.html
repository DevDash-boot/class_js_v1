  <body>
    <h1>9/22 ~ 9/23 연습</h1>
    <h2>조건문 + 함수</h2>
    <script>
      function checkNumber(n) {
        if (n % 2 == 0) {
          return "짝수";
        } else {
          return "홀수";
        }
      }

      console.log(checkNumber(10));
      console.log(checkNumber(7));
    </script>
  </body>
